<!DOCTYPE html>  <html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bikaner Express Admin</title>  
<style>  
body{font-family:Arial,sans-serif;background:#fff8ed;color:#382417;margin:0;padding:12px}.card,.panel{max-width:900px;margin:16px auto;padding:18px;background:white;border-radius:14px;box-shadow:0 4px 16px #0001} .card{max-width:500px}h1{color:#a94313}input,button,select{box-sizing:border-box;width:100%;padding:12px;margin-top:10px;border-radius:8px;font-size:16px}input,select{border:1px solid #d8c8b8;background:white}button{background:#a94313;color:white;border:0;font-weight:bold}.item{border:1px solid #e2cdbb;border-radius:10px;padding:12px;margin:12px 0;overflow-wrap:anywhere}.good{background:#277448}.bad{background:#9d2525}p{overflow-wrap:anywhere}  
</style></head><body>  
<div class="card"><h1>🛵 Bikaner Express</h1><h2>Admin Login</h2><form id="loginForm"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button id="loginButton">Login</button></form><p id="message"></p></div>  
<main id="dashboard" style="display:none">  
<section class="panel"><h2>🏪 Shop Approval / Management</h2><p>नई दुकान pending और offline रहती है। Approve होने के बाद भी उसे अलग से online करना होगा।</p><button id="refreshShops">Shops Refresh करें</button><p id="shopsMessage"></p><div id="shopsList"></div></section>  
<section class="panel"><h2>📦 Customer Orders</h2><button id="refreshOrders">Orders Refresh करें</button><p id="ordersMessage"></p><div id="ordersList"></div></section>  
<section class="panel"><h2>🛵 Delivery Boy Approval</h2><button id="refreshBoys">Delivery Boys Refresh करें</button><p id="boysMessage"></p><div id="boysList"></div></section>  
<section class="panel"><button id="logout">Logout</button></section></main>  
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>  
<script>  
const firebaseConfig={apiKey:"AIzaSyDhumnH7lRnz_LVJLTMklksusBPaDAkCh4",authDomain:"bikaner-express-537a2.firebaseapp.com",databaseURL:"https://bikaner-express-537a2-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"bikaner-express-537a2",storageBucket:"bikaner-express-537a2.firebasestorage.app",messagingSenderId:"852964791053",appId:"1:852964791053:web:94c129e58b72a375661644"};  
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);  
const auth=firebase.auth(),db=firebase.database(),ADMIN_UID="i8dtxW327zN1onqskZ7MfK3QDcc2";  
const $=id=>document.getElementById(id);let approvedBoys=[];  
function text(parent,tag,value){let e=document.createElement(tag);e.textContent=value;parent.appendChild(e);return e}  
function btn(parent,label,fn,cls=""){let b=document.createElement("button");b.type="button";b.textContent=label;if(cls)b.className=cls;parent.appendChild(b);b.onclick=fn;return b}  
function show(){ $("loginForm").parentElement.style.display="none";$("dashboard").style.display="block"}  
function loginView(){ $("loginForm").parentElement.style.display="block";$("dashboard").style.display="none"}  
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginButton").disabled=true;$("message").textContent="Login हो रहा है...";try{let r=await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value);if(r.user.uid!==ADMIN_UID){await auth.signOut();$("message").textContent="यह Admin account नहीं है।";return}show();await refreshAll()}catch(err){console.error(err);$("message").textContent="Login नहीं हुआ। Email/password जाँचें।"}finally{$("loginButton").disabled=false}};  
auth.onAuthStateChanged(async u=>{if(!u){loginView();return}if(u.uid!==ADMIN_UID){await auth.signOut();loginView();$("message").textContent="यह Admin account नहीं है।";return}show();await refreshAll()});  
$("logout").onclick=async()=>{await auth.signOut();loginView();$("message").textContent="Logout हो गया।"};  
async function refreshAll(){await Promise.all([loadShops(),loadBoys(),loadOrders()])}  
$("refreshShops").onclick=loadShops;$("refreshBoys").onclick=async()=>{await loadBoys();await loadOrders()};$("refreshOrders").onclick=loadOrders;  
async function changeShop(uid,changes,confirmText){if(!auth.currentUser||auth.currentUser.uid!==ADMIN_UID){$("shopsMessage").textContent="केवल Main Admin यह कर सकता है।";return}if(!confirm(confirmText))return;try{await db.ref("shops/"+uid).update(changes);$("shopsMessage").textContent="बदलाव सेव हो गया।";await loadShops()}catch(e){console.error(e);$("shopsMessage").textContent="सेव नहीं हुआ। Firebase Rules जाँचें।"}}  
async function loadShops(){$("shopsMessage").textContent="Shops लोड हो रही हैं...";$("shopsList").replaceChildren();try{let s=await db.ref("shops").once("value");if(!s.exists()){$("shopsMessage").textContent="अभी कोई Shop Registration नहीं मिला।";return}let n=0;s.forEach(c=>{n++;let x=c.val()||{},uid=c.key,card=document.createElement("div");card.className="item";text(card,"h3",x.shopName||"दुकान का नाम नहीं");text(card,"p","Owner: "+(x.ownerName||"-"));text(card,"p","Mobile: "+(x.phone||"-")+" | Email: "+(x.email||"-"));text(card,"p","Address: "+(x.address||"-"));text(card,"p","Approval: "+(x.approvalStatus||"pending")+" | Account: "+(x.accountStatus||"active")+" | Availability: "+(x.availability||"offline"));text(card,"p","UID: "+uid);  
if((x.approvalStatus||"pending")==="pending"||x.approvalStatus==="rejected")btn(card,"Approve Shop",()=>changeShop(uid,{approvalStatus:"approved",availability:"offline"},"इस दुकान को Approve करें?"),"good");  
if(x.approvalStatus==="pending"||x.approvalStatus==="approved")btn(card,"Reject Shop",()=>changeShop(uid,{approvalStatus:"rejected",availability:"offline"},"इस दुकान को Reject करें?"),"bad");  
if(x.accountStatus!=="disabled")btn(card,"Disable Shop",()=>changeShop(uid,{accountStatus:"disabled",availability:"offline"},"दुकान Disable करें? इससे वह Offline हो जाएगी।"),"bad");  
else btn(card,"Reactivate Shop",()=>changeShop(uid,{accountStatus:"active",availability:"offline"},"दुकान फिर Active करें? यह Offline रहेगी।"),"good");  
$("shopsList").appendChild(card)});$("shopsMessage").textContent="कुल Shops: "+n} catch(e) {
  console.error("Shop loading error:", e);
  $("shopsMessage").textContent =
    "Firebase Error: " + (e.code || e.message || "Unknown error");
}}  
async function loadBoys(){$("boysMessage").textContent="Delivery Boys लोड हो रहे हैं...";$("boysList").replaceChildren();approvedBoys=[];try{let s=await db.ref("deliveryBoys").once("value");if(!s.exists()){$("boysMessage").textContent="अभी कोई Delivery Boy नहीं है।";return}let n=0;s.forEach(c=>{n++;let x=c.val()||{},uid=c.key,card=document.createElement("div");card.className="item";text(card,"h3",x.name||"नाम नहीं दिया");text(card,"p","Mobile: "+(x.phone||"-")+" | Email: "+(x.email||"-"));text(card,"p","Status: "+(x.status||"pending"));if(x.status==="approved")approvedBoys.push({uid,name:x.name||"Delivery Boy",phone:x.phone||""});if(x.status==="pending")btn(card,"Approve Delivery Boy",async()=>{try{await db.ref("deliveryBoys/"+uid+"/status").set("approved");$("boysMessage").textContent="Approve हो गया।";await loadBoys();await loadOrders()}catch(e){console.error(e);$("boysMessage").textContent="Approve नहीं हुआ। Rules जाँचें।"}});$("boysList").appendChild(card)});$("boysMessage").textContent="कुल: "+n+" | Approved: "+approvedBoys.length}catch(e){console.error(e);$("boysMessage").textContent="Delivery Boys load नहीं हुए। Rules जाँचें।"}}  
async function loadOrders(){$("ordersMessage").textContent="Orders लोड हो रहे हैं...";$("ordersList").replaceChildren();try{let s=await db.ref("orders").once("value");if(!s.exists()){$("ordersMessage").textContent="अभी कोई order नहीं मिला।";return}let rows=[];s.forEach(c=>c.forEach(o=>rows.push({customerUid:c.key,key:o.key,order:o.val()||{}})));if(!rows.length){$("ordersMessage").textContent="अभी कोई order नहीं मिला।";return}for(let r of rows){let o=r.order,card=document.createElement("div");card.className="item";text(card,"h3","Order: "+(o.id||r.key));text(card,"p","नाम: "+(o.name||"-")+" | Mobile: "+(o.phone||"-")+" | Total: ₹"+(o.total??0));text(card,"p","Address: "+(o.address||"-"));text(card,"p","Shop: "+(o.shop||"-"));text(card,"p","Items: "+(Array.isArray(o.items)?o.items.map(i=>(i.name||"Item")+" × "+(i.quantity??1)).join(", "):"डेटा format जाँचें"));text(card,"p","Status: "+(o.status||"New"));text(card,"p","Payment: "+(o.paymentMethod||"पुराना Order")+" | Payment Status: "+(o.paymentStatus||"Not Recorded"));let sel=document.createElement("select");["New","Accepted","Preparing","Assigned","Out for Delivery","Delivered","Cancelled"].forEach(v=>{let op=document.createElement("option");op.value=v;op.textContent=v;sel.appendChild(op)});sel.value=sel.querySelector('option[value="'+(o.status||"New")+'"]')?o.status||"New":"New";card.appendChild(sel);let ds=document.createElement("select"),op=document.createElement("option");op.value="";op.textContent="Delivery Boy चुनें";ds.appendChild(op);approvedBoys.forEach(b=>{let p=document.createElement("option");p.value=b.uid;p.textContent=b.name+" "+b.phone;ds.appendChild(p)});if(o.assignedDeliveryUid)ds.value=o.assignedDeliveryUid;card.appendChild(ds);  
btn(card,"Assign Order",async()=>{let uid=ds.value,b=approvedBoys.find(z=>z.uid===uid);if(!b){$("ordersMessage").textContent="पहले approved Delivery Boy चुनें।";return}try{await db.ref("assignedOrders/"+uid+"/"+r.key).set({orderId:r.key,customerUid:r.customerUid,name:o.name||"",phone:o.phone||"",address:o.address||"",items:o.items||[],total:o.total??0,shop:o.shop||"",status:"Assigned",assignedAt:Date.now()});await db.ref("orders/"+r.customerUid+"/"+r.key).update({assignedDeliveryUid:uid,assignedDeliveryName:b.name,status:"Assigned"});$("ordersMessage").textContent="Order assign हो गया।";await loadOrders()}catch(e){console.error(e);$("ordersMessage").textContent="Assign नहीं हुआ। Rules जाँचें।"}});  
btn(card,"Status Save करें",async()=>{try{await db.ref("orders/"+r.customerUid+"/"+r.key+"/status").set(sel.value);if(o.assignedDeliveryUid)await db.ref("assignedOrders/"+o.assignedDeliveryUid+"/"+r.key+"/status").set(sel.value);$("ordersMessage").textContent="Status save हो गया।";await loadOrders()}catch(e){console.error(e);$("ordersMessage").textContent="Status save नहीं हुआ। Rules जाँचें।"}});  
$("ordersList").appendChild(card)}$("ordersMessage").textContent="कुल Orders: "+rows.length}catch(e){console.error(e);$("ordersMessage").textContent="Orders load नहीं हुए। Admin login और Firebase Rules जाँचें।"}}  
</script></body></html>
